{% extends "base.html" %}


{% block content %}

<h2>Edit Flashcard</h2>


<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


    <label for="subject_id">
        Subject
    </label>

    <select
        id="subject_id"
        name="subject_id"
        required
    >

        {% for subject in subjects %}

            <option
                value="{{ subject.id }}"

                {% if subject.id == card.subject_id %}
                    selected
                {% endif %}
            >
                {{ subject.name }}
            </option>

        {% endfor %}

    </select>


    <label for="question">
        Question
    </label>

    <textarea
        id="question"
        name="question"
        required
    >{{ card.question }}</textarea>


    <label for="answer">
        Answer
    </label>

    <textarea
        id="answer"
        name="answer"
        required
    >{{ card.answer }}</textarea>


    <button type="submit">
        Save Changes
    </button>

</form>


{% endblock %}
