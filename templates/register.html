{% extends "base.html" %}


{% block content %}

<h2>Create account</h2>


<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


    <label for="email">
        Email
    </label>

    <input
        id="email"
        name="email"
        type="email"
        required
    >


    <label for="password">
        Password
    </label>

    <input
        id="password"
        name="password"
        type="password"
        minlength="10"
        required
    >


    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
