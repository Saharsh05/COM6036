{% extends "base.html" %}

{% block content %}

<h2>Your Subjects</h2>

<p>
    <a href="{{ url_for('create_subject') }}">
        Create Subject
    </a>
</p>

{% if subjects %}

    {% for subject in subjects %}

        <article>

            <h3>
                {{ subject.name }}
            </h3>

            <p>
                Flashcards:
                {{ subject.flashcards|length }}
            </p>

            <form
                method="POST"
                action="{{ url_for(
                    'delete_subject',
                    subject_id=subject.id
                ) }}"
            >

                <input
                    type="hidden"
                    name="csrf_token"
                    value="{{ csrf_token() }}"
                >

                <button type="submit">
                    Delete Subject
                </button>

            </form>

        </article>

    {% endfor %}

{% else %}

    <p>
        You have not created any subjects yet.
    </p>

{% endif %}

{% endblock %}
