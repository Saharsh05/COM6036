
{% extends "base.html" %}


{% block content %}

<h2>Review Flashcard</h2>


<section>

    <p>
        <strong>Question:</strong>
    </p>

    <p>
        {{ card.question }}
    </p>


    <details>

        <summary>
            Reveal answer
        </summary>

        <p>
            {{ card.answer }}
        </p>

    </details>

</section>


<form method="POST">

    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >


    <label for="rating">
        How confident are you with this answer?
    </label>

    <select
        id="rating"
        name="rating"
        required
    >

        <option value="">
            Select confidence
        </option>

        <option value="0">
            0 - No recall
        </option>

        <option value="1">
            1 - Very weak
        </option>

        <option value="2">
            2 - Weak
        </option>

        <option value="3">
            3 - Reasonable
        </option>

        <option value="4">
            4 - Strong
        </option>

        <option value="5">
            5 - Very strong
        </option>

    </select>


    <button type="submit">
        Save Review
    </button>

</form>


<p>
    <a href="{{ url_for('dashboard') }}">
        Back to Dashboard
    </a>
</p>

{% endblock %}
